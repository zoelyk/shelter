<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Shelter System - Advanced Simulator</title>
    <style>
        :root {
            --wall: #e5d3b3; 
            --floor: #8d6e63;
            --bed-color: #5c6bc0;
            --wood-dark: #5d4037;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #222; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        
        .room-stage {
            width: 900px; height: 500px; background: var(--wall);
            border: 12px solid var(--wood-dark); position: relative;
            overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Earth Shake Physics */
        .seismic-activity { animation: groundShake 0.15s infinite; }
        @keyframes groundShake {
            0% { transform: translate(2px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* Floor and Background elements */
        .floor { position: absolute; bottom: 0; width: 100%; height: 40px; background: var(--floor); border-top: 4px solid #4e342e; }

        /* Character Model (Realistic Human) */
        .character {
            position: absolute; width: 40px; height: 80px;
            transition: all 1s ease-in-out; z-index: 10;
        }
        .head { width: 25px; height: 25px; background: #ffdbac; border-radius: 50%; margin: 0 auto; position: relative; }
        .body { width: 30px; height: 40px; background: #34495e; border-radius: 5px; margin: -2px auto; }
        .limbs { width: 100%; height: 10px; display: flex; justify-content: space-between; }
        .leg { width: 10px; height: 20px; background: #2c3e50; }

        /* Wardrobe with Smart Legs (Reference: IMG_2740) */
        .wardrobe {
            position: absolute; bottom: 40px; right: 120px;
            width: 110px; height: 240px; background: #a1887f;
            border: 3px solid #6d4c41; transition: all 0.8s ease;
            transform-origin: bottom center; z-index: 5;
        }
        .wardrobe-doors { display: flex; height: 100%; padding: 5px; gap: 5px; }
        .door { flex: 1; background: white; border: 1px solid #ccc; position: relative; }
        .handle { position: absolute; right: 5px; top: 50%; width: 5px; height: 15px; background: gold; }
        
        .safety-legs {
            position: absolute; bottom: 0; left: -40px; width: 190px; height: 12px;
            background: #ecf0f1; border: 2px solid #bdc3c7;
            display: none; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        /* Bed System (Reference: IMG_2733) */
        .bed-container {
            position: absolute; bottom: 40px; left: 100px;
            width: 280px; height: 120px;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom right;
        }
        .mattress { width: 100%; height: 40px; background: white; border-radius: 8px; border-bottom: 8px solid #ddd; position: relative; z-index: 2; }
        .bed-frame { width: 105%; height: 50px; background: #444; position: absolute; bottom: -10px; left: -2.5%; border-radius: 4px; }
        
        .arched-shield {
            position: absolute; top: -100px; left: 0; width: 100%; height: 120px;
            background: white; border: 4px solid #ff99cc; border-radius: 140px 140px 0 0;
            transform: scaleY(0); transform-origin: bottom; transition: 0.8s;
            background-image: radial-gradient(#ff99cc 15%, transparent 16%);
            background-size: 30px 30px; opacity: 0.95; z-index: 15;
        }

        /* Safety Zone & Debris */
        .safety-zone {
            position: absolute; bottom: -50px; left: 0; width: 100%; height: 50px;
            background: rgba(46, 204, 113, 0.4); border: 2px solid #2ecc71;
            border-radius: 10px; opacity: 0; transition: 1s;
            display: flex; align-items: center; justify-content: center; font-weight: bold; color: #2ecc71;
        }
        .emergency-kit { width: 30px; height: 20px; background: red; position: relative; margin-right: 10px; }

        /* Other Objects (Move around during quake) */
        .mirror { position: absolute; bottom: 40px; left: 450px; width: 40px; height: 100px; background: #add8e6; border: 4px solid white; transition: 0.8s; }
        .ceiling-light { position: absolute; top: 0; left: 50%; width: 60px; height: 20px; background: #f1c40f; border-radius: 0 0 30px 30px; transition: 1s; }

        /* Animation States */
        .fall-and-slide { transform: rotate(-85deg) translate(-50px, 20px); }
        .tilt-20 { transform: rotate(20deg); }
        .person-slide { transform: translate(140px, 80px) rotate(90deg); }
        .person-crushed { transform: translate(-300px, 300px) rotate(110deg); filter: grayscale(1) sepia(1) hue-rotate(-50deg); }
        .active { display: block !important; }
        .deployed { transform: scaleY(1) !important; }

        .controls { margin: 20px; display: flex; gap: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .danger { background: #e74c3c; color: white; }
        .safe { background: #2ecc71; color: white; }
        .reset { background: #7f8c8d; color: white; }
    </style>
</head>
<body>

    <h2>Smart Home Shelter System Simulator</h2>

    <div class="room-stage" id="stage">
        <div class="ceiling-light" id="light"></div>
        <div class="mirror" id="mirror"></div>
        
        <div class="wardrobe" id="wardrobe">
            <div class="wardrobe-doors">
                <div class="door"><div class="handle"></div></div>
                <div class="door"><div class="handle"></div></div>
            </div>
            <div class="safety-legs" id="legs"></div>
        </div>

        <div class="bed-container" id="bed">
            <div class="arched-shield" id="shield"></div>
            <div class="mattress">
                <div class="character" id="human">
                    <div class="head"></div>
                    <div class="body"></div>
                    <div class="limbs">
                        <div class="leg"></div>
                        <div class="leg"></div>
                    </div>
                </div>
            </div>
            <div class="bed-frame"></div>
            <div class="safety-zone" id="zone">
                <div class="emergency-kit"></div> SAFE ZONE
            </div>
        </div>
        
        <div class="floor"></div>
    </div>

    <div class="controls">
        <button class="btn danger" onclick="simulateDanger()">SITUATION 1: DANGER</button>
        <button class="btn safe" onclick="simulateSafe()">SITUATION 2: SMART SYSTEM</button>
        <button class="btn reset" onclick="resetSimulator()">RESET</button>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const human = document.getElementById('human');
        const wardrobe = document.getElementById('wardrobe');
        const legs = document.getElementById('legs');
        const bed = document.getElementById('bed');
        const shield = document.getElementById('shield');
        const zone = document.getElementById('zone');
        const mirror = document.getElementById('mirror');
        const light = document.getElementById('light');

        function simulateDanger() {
            resetSimulator();
            stage.classList.add('seismic-activity');
            
            // Chaos starts
            setTimeout(() => {
                // Furniture moves around and falls
                mirror.style.left = "400px";
                mirror.style.transform = "rotate(-90deg)";
                light.style.top = "400px";
                light.style.transform = "rotate(45deg)";
                
                setTimeout(() => {
                    wardrobe.classList.add('fall-and-slide');
                    human.classList.add('person-crushed');
                }, 500);
            }, 800);
        }

        function simulateSafe() {
            resetSimulator();
            stage.classList.add('seismic-activity');

            // Smart detection in 0.4s
            setTimeout(() => {
                shield.classList.add('deployed'); // Arched shield opens
                legs.classList.add('active');     // Wardrobe legs protect from falling
                bed.classList.add('tilt-20');     // Bed tilts 20 degrees
                
                setTimeout(() => {
                    human.classList.add('person-slide'); // Slide to safety
                    zone.style.opacity = "1";            // Safety zone lights up
                    
                    // Ceiling debris falls but person is already sheltered
                    light.style.top = "150px"; 
                }, 600);
            }, 400);
        }

        function resetSimulator() {
            stage.classList.remove('seismic-activity');
            wardrobe.classList.remove('fall-and-slide');
            legs.classList.remove('active');
            bed.classList.remove('tilt-20');
            shield.classList.remove('deployed');
            human.className = 'character';
            zone.style.opacity = "0";
            mirror.style = "";
            light.style = "";
        }
    </script>
</body>
</html>
