<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>智慧避難家具系統模擬器</title>
    <style>
        :root {
            --wall: #e5d3b3; 
            --floor: #8d6e63;
            --bed-color: #5c6bc0;
            --wood-dark: #5d4037;
            --safe-green: #2ecc71;
            --danger-red: #e74c3c;
        }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #222; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .main-container { display: flex; gap: 20px; width: 100%; max-width: 1200px; justify-content: center; }
        
        .simulation-box { flex: 1; text-align: center; }

        .room-stage {
            height: 450px; background: var(--wall);
            border: 8px solid var(--wood-dark); position: relative;
            overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* 地震晃動特效 */
        .seismic-activity { animation: groundShake 0.1s infinite; }
        @keyframes groundShake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        .floor { position: absolute; bottom: 0; width: 100%; height: 30px; background: var(--floor); border-top: 4px solid #4e342e; }

        /* 人物模型 */
        .character { position: absolute; width: 30px; height: 60px; transition: all 1s ease-in-out; z-index: 10; }
        .head { width: 20px; height: 20px; background: #ffdbac; border-radius: 50%; margin: 0 auto; }
        .body { width: 24px; height: 30px; background: #34495e; border-radius: 4px; margin: -2px auto; }

        /* 衣櫃與旋轉腳 (參考 IMG_2740) */
        .wardrobe {
            position: absolute; bottom: 30px; right: 40px;
            width: 80px; height: 180px; background: #a1887f;
            border: 3px solid #6d4c41; transition: all 0.8s ease;
            transform-origin: bottom center; z-index: 5;
        }
        .wardrobe-doors { display: flex; height: 100%; padding: 3px; gap: 3px; }
        .door { flex: 1; background: white; border: 1px solid #ccc; }
        
        /* 旋轉腳動作：原本離地，旋轉90度落地 */
        .rotational-leg {
            position: absolute; top: 120px; right: -15px;
            width: 15px; height: 60px; background: #ecf0f1;
            border: 2px solid #bdc3c7; border-radius: 5px;
            transform-origin: top center;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: rotate(0deg); /* 初始離地掛在側面 */
        }
        .rotational-leg.deployed { transform: rotate(-90deg) translate(-30px, 15px); }

        /* 床鋪系統 (參考 IMG_2733) */
        .bed-container {
            position: absolute; bottom: 30px; left: 40px;
            width: 180px; height: 80px;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
        }
        .mattress { width: 100%; height: 30px; background: white; border-radius: 5px; position: relative; z-index: 2; }
        .bed-frame { width: 100%; height: 40px; background: #444; position: absolute; bottom: -5px; border-radius: 3px; }
        
        .arched-shield {
            position: absolute; top: -70px; left: 0; width: 100%; height: 90px;
            background: white; border: 3px solid #ff99cc; border-radius: 100px 100px 0 0;
            transform: scaleY(0); transform-origin: bottom; transition: 0.6s;
            background-image: radial-gradient(#ff99cc 15%, transparent 16%);
            background-size: 20px 20px; opacity: 0.9; z-index: 15;
        }

        /* 安全區 */
        .safety-zone {
            position: absolute; bottom: -40px; left: 0; width: 100%; height: 40px;
            background: rgba(46, 204, 113, 0.4); border: 2px solid var(--safe-green);
            opacity: 0; transition: 0.8s; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--safe-green);
        }

        /* 動作類別 */
        .fall-danger { transform: rotate(-85deg); }
        .tilt-20 { transform: rotate(20deg); }
        .person-slide { transform: translate(100px, 60px) rotate(90deg); }
        .person-crushed { transform: translate(-50px, 100px) rotate(110deg); filter: grayscale(1); }
        .active { transform: scaleY(1) !important; }

        .controls { margin-top: 15px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .danger-btn { background: var(--danger-red); color: white; }
        .safe-btn { background: var(--safe-green); color: white; }
        .reset-btn { background: #7f8c8d; color: white; }
    </style>
</head>
<body>

    <h2>智慧避難家具系統模擬器 (Smart Home Shelter System)</h2>

    <div class="main-container">
        <div class="simulation-box">
            <h3>情況 1：無智慧系統</h3>
            <div class="room-stage" id="stage1">
                <div class="wardrobe" id="ward1">
                    <div class="wardrobe-doors"><div class="door"></div><div class="door"></div></div>
                </div>
                <div class="bed-container" id="bed1">
                    <div class="mattress"><div class="character" id="human1"><div class="head"></div><div class="body"></div></div></div>
                    <div class="bed-frame"></div>
                </div>
                <div class="floor"></div>
            </div>
            <div class="controls">
                <button class="btn danger-btn" onclick="startSituation1()">模擬地震</button>
            </div>
        </div>

        <div class="simulation-box">
            <h3>情況 2：智慧避難系統</h3>
            <div class="room-stage" id="stage2">
                <div class="wardrobe" id="ward2">
                    <div class="wardrobe-doors"><div class="door"></div><div class="door"></div></div>
                    <div class="rotational-leg" id="leg2"></div>
                </div>
                <div class="bed-container" id="bed2">
                    <div class="arched-shield" id="shield2"></div>
                    <div class="mattress"><div class="character" id="human2"><div class="head"></div><div class="body"></div></div></div>
                    <div class="bed-frame"></div>
                    <div class="safety-zone" id="zone2">安全避難區</div>
                </div>
                <div class="floor"></div>
            </div>
            <div class="controls">
                <button class="btn safe-btn" onclick="startSituation2()">啟動智慧防禦</button>
            </div>
        </div>
    </div>

    <button class="btn reset-btn" onclick="resetAll()">全部重置</button>

    <script>
        function startSituation1() {
            document.getElementById('stage1').classList.add('seismic-activity');
            setTimeout(() => {
                document.getElementById('ward1').classList.add('fall-danger');
                document.getElementById('human1').classList.add('person-crushed');
            }, 800);
        }

        function startSituation2() {
            document.getElementById('stage2').classList.add('seismic-activity');
            // 系統偵測並反應
            setTimeout(() => {
                document.getElementById('shield2').classList.add('active'); // 防護罩開啟
                document.getElementById('leg2').classList.add('deployed'); // 櫃腳旋轉 90 度支撐地面
                document.getElementById('bed2').classList.add('tilt-20');   // 床鋪傾斜 20 度
                
                setTimeout(() => {
                    document.getElementById('human2').classList.add('person-slide'); // 人物滑入
                    document.getElementById('zone2').style.opacity = "1";
                }, 600);
            }, 300);
        }

        function resetAll() {
            // 重置左側
            document.getElementById('stage1').classList.remove('seismic-activity');
            document.getElementById('ward1').classList.remove('fall-danger');
            document.getElementById('human1').className = 'character';

            // 重置右側
            document.getElementById('stage2').classList.remove('seismic-activity');
            document.getElementById('shield2').classList.remove('active');
            document.getElementById('leg2').classList.remove('deployed');
            document.getElementById('bed2').classList.remove('tilt-20');
            document.getElementById('human2').className = 'character';
            document.getElementById('zone2').style.opacity = "0";
        }
    </script>
</body>
</html>
