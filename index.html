<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Shelter System Simulator</title>
    <style>
        :root {
            --wall-color: #f3e5ab; /* Wooden wall like IMG_2740 */
            --floor-color: #d7ccc8;
            --bed-blue: #a2c2e1;
            --wood: #8d6e63;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #333; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { margin-top: 20px; text-align: center; }
        
        /* Room Styling based on IMG_2740 */
        .room-view {
            width: 800px;
            height: 450px;
            background: var(--wall-color);
            border: 10px solid #5d4037;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Earth Shake */
        .shake { animation: quake 0.1s infinite; }
        @keyframes quake {
            0% { left: -2px; top: 1px; }
            50% { left: 2px; top: -1px; }
            100% { left: 0px; top: 0px; }
        }

        /* Ceiling & Floor */
        .floor { position: absolute; bottom: 0; width: 100%; height: 30px; background: var(--floor-color); border-top: 2px solid #bcaaa4; }

        /* Furniture - Bed (Reference IMG_2733) */
        .bed-unit {
            position: absolute; bottom: 30px; left: 100px;
            width: 250px; height: 100px;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
        }
        .bed-frame { width: 100%; height: 40px; background: #555; position: absolute; bottom: 0; border-radius: 5px; }
        .mattress { width: 90%; height: 20px; background: white; border: 1px solid #ddd; margin: 0 auto; position: relative; top: -10px; border-radius: 5px; }

        /* Arched Shield (Reference IMG_2733 heart pattern) */
        .shield {
            position: absolute; top: -80px; left: 0; width: 250px; height: 100px;
            background: #fff; border: 3px solid #777;
            border-radius: 125px 125px 0 0;
            background-image: radial-gradient(circle, #ff99cc 20%, transparent 20%);
            background-size: 40px 40px; /* Mock heart pattern */
            transform: translateY(-50px) scaleY(0);
            transform-origin: bottom;
            transition: all 0.8s ease-in-out;
            opacity: 0.9;
        }
        .shield.active { transform: translateY(0) scaleY(1); }

        /* Wardrobe (Reference IMG_2740) */
        .wardrobe {
            position: absolute; bottom: 30px; right: 100px;
            width: 100px; height: 220px; background: #a1887f;
            border: 4px solid #6d4c41; transition: transform 0.8s;
            transform-origin: bottom left;
        }
        .wardrobe-door { width: 45%; height: 80%; background: white; margin: 10% 2%; display: inline-block; border: 1px solid #ccc; }
        
        /* Wardrobe Legs (Smart Mode) */
        .legs {
            position: absolute; bottom: 0; left: -30px; width: 160px; height: 15px;
            background: #eee; border: 2px solid #999; display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Person & Shelter */
        .person {
            position: absolute; top: -35px; left: 100px;
            width: 30px; height: 60px; background: #ffccbc;
            border-radius: 15px; transition: all 1.2s;
        }
        .shelter-zone {
            position: absolute; bottom: -40px; left: 0; width: 100%; height: 40px;
            background: rgba(46, 204, 113, 0.3); border: 2px dashed #2ecc71;
            display: flex; align-items: center; justify-content: center;
            color: #2ecc71; font-weight: bold; opacity: 0;
        }

        /* Animations for Falling */
        .fall-over { transform: rotate(-85deg); }
        .tilt-20 { transform: rotate(20deg); }
        .slide-down { transform: translate(120px, 60px) rotate(90deg); }
        .injured { background: #e74c3c !important; transform: translateY(180px) rotate(70deg); }

        /* Controls */
        .ui-panel { display: flex; gap: 20px; margin: 20px; }
        .btn { padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.3s; }
        .danger-btn { background: #e74c3c; color: white; }
        .safe-btn { background: #2ecc71; color: white; }
        .reset-btn { background: #95a5a6; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Smart Home Shelter System - Comparison Simulator</h2>
        <div class="room-view" id="room">
            <div class="floor"></div>
            
            <div class="wardrobe" id="wardrobe">
                <div class="wardrobe-door"></div><div class="wardrobe-door"></div>
                <div class="legs" id="legs"></div>
            </div>

            <div class="bed-unit" id="bedUnit">
                <div class="shield" id="shield"></div>
                <div class="mattress">
                    <div class="person" id="person"></div>
                </div>
                <div class="bed-frame"></div>
                <div class="shelter-zone" id="shelter">RESCUE KIT LOADED</div>
            </div>
        </div>

        <div class="ui-panel">
            <button class="btn danger-btn" onclick="runDanger()">Situation 1: NO SYSTEM</button>
            <button class="btn safe-btn" onclick="runSafe()">Situation 2: SMART SYSTEM</button>
            <button class="btn reset-btn" onclick="reset()">Reset All</button>
        </div>
    </div>

    <script>
        const room = document.getElementById('room');
        const wardrobe = document.getElementById('wardrobe');
        const bed = document.getElementById('bedUnit');
        const shield = document.getElementById('shield');
        const person = document.getElementById('person');
        const legs = document.getElementById('legs');
        const shelter = document.getElementById('shelter');

        function runDanger() {
            reset();
            room.classList.add('shake');
            setTimeout(() => {
                wardrobe.classList.add('fall-over');
                setTimeout(() => { person.classList.add('injured'); }, 400);
            }, 1000);
        }

        function runSafe() {
            reset();
            room.classList.add('shake');
            // System detects shaking in 0.3 seconds!
            setTimeout(() => {
                shield.classList.add('active'); // Arched shield opens
                legs.style.display = 'block';   // Wardrobe legs open
                bed.classList.add('tilt-20');   // Bed tilts 20 degrees
                person.classList.add('slide-down'); // Person slides to shelter
                shelter.style.opacity = '1';
            }, 400);
        }

        function reset() {
            room.classList.remove('shake');
            wardrobe.classList.remove('fall-over');
            bed.classList.remove('tilt-20');
            shield.classList.remove('active');
            person.classList.className = 'person';
            person.classList.remove('injured', 'slide-down');
            legs.style.display = 'none';
            shelter.style.opacity = '0';
        }
    </script>
</body>
</html>
