<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Shelter System Simulator</title>
    <style>
        :root {
            --wall: #e5d3b3; 
            --floor: #8d6e63;
            --wood-dark: #5d4037;
            --safe-green: #2ecc71;
            --danger-red: #e74c3c;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #222; color: white; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
        }
        
        /* School and Title Styling */
        .header-section { text-align: center; margin-bottom: 30px; }
        .school-name { 
            font-size: 1.2em; 
            color: #bdc3c7; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        h2 { margin: 0; font-size: 2.2em; color: white; }

        .main-container { display: flex; gap: 30px; width: 100%; max-width: 1200px; justify-content: center; }
        
        .simulation-box { flex: 1; text-align: center; }

        .room-stage {
            height: 450px; background: var(--wall);
            border: 8px solid var(--wood-dark); position: relative;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Earthquake Shaking Animation */
        .seismic-activity { animation: groundShake 0.1s infinite; }
        @keyframes groundShake {
            0% { transform: translate(3px, 1px); }
            50% { transform: translate(-3px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* Floor */
        .floor { position: absolute; bottom: 0; width: 100%; height: 30px; background: var(--floor); border-top: 4px solid #4e342e; z-index: 8; }

        /* Sleeping Character */
        .character { 
            position: absolute; bottom: 100%; left: 20px; 
            width: 60px; height: 25px; padding-bottom: 2px;
            display: flex; align-items: flex-end; 
            transition: all 1s ease-in-out; z-index: 10; 
        }
        .head { width: 22px; height: 22px; background: #ffdbac; border-radius: 50%; }
        .body { width: 35px; height: 18px; background: #34495e; border-radius: 4px; margin-left: 2px; }

        /* Wardrobe Structure */
        .wardrobe {
            position: absolute; bottom: 30px; right: 40px;
            width: 90px; height: 180px; background: #a1887f;
            border: 3px solid #6d4c41; transition: transform 0.8s ease-in;
            transform-origin: bottom left; z-index: 5;
        }
        .wardrobe-doors { display: flex; height: 100%; padding: 4px; gap: 4px; box-sizing: border-box;}
        .door { flex: 1; background: white; border: 1px solid #ccc; }
        
        /* Two Rotational Legs (Left and Right) */
        .rotational-leg {
            position: absolute; top: 120px; 
            width: 15px; height: 60px; background: #ecf0f1;
            border: 2px solid #bdc3c7; border-radius: 3px;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 4;
        }
        .left-leg { left: -15px; transform-origin: top center; transform: rotate(90deg); }
        .right-leg { right: -15px; transform-origin: top center; transform: rotate(-90deg); }
        
        .left-leg.deployed { transform: rotate(0deg); }
        .right-leg.deployed { transform: rotate(0deg); }

        /* Bed System */
        .bed-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 200px; height: 50px;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right; 
            z-index: 3;
            perspective: 800px;
            transform-style: preserve-3d;
        }
        .bed-frame { width: 100%; height: 30px; background: #444; position: absolute; bottom: 0; border-radius: 4px; z-index: 2; }
        .mattress { width: 100%; height: 20px; background: white; position: absolute; bottom: 30px; border-radius: 4px; z-index: 2; }
        
        /* Arched Shield (Attached to the back, flips forward) */
        .arched-shield {
            position: absolute; top: -80px; left: 0; width: 100%; height: 110px;
            background: white; border: 4px solid #ff99cc; border-radius: 120px 120px 0 0;
            background-image: radial-gradient(#ff99cc 15%, transparent 16%);
            background-size: 20px 20px; opacity: 0.95; z-index: 15;
            box-sizing: border-box;
            transform-origin: bottom center; 
            transform: rotateX(-90deg); 
            transition: transform 0.7s ease-out;
        }

        /* Safe Zone */
        .safety-zone {
            position: absolute; bottom: 30px; left: 240px; 
            width: 110px; height: 40px;
            background: rgba(46, 204, 113, 0.3); border: 2px dashed var(--safe-green);
            opacity: 0; transition: 0.8s; display: flex; align-items: center; justify-content: center; 
            font-size: 14px; color: var(--safe-green); font-weight: bold; z-index: 1;
        }

        /* Animation Classes */
        .fall-danger { transform: rotate(-85deg); } 
        .tilt-20 { transform: rotate(20deg); }      
        .shield-active { transform: rotateX(0deg); }    
        .person-slide { transform: translate(175px, 35px) rotate(10deg); }
        .person-crushed { transform: translate(60px, 10px) rotate(-15deg); filter: grayscale(1); opacity: 0.7;}

        /* Controls */
        .controls { margin-top: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin: 5px; transition: 0.3s;}
        .btn:hover { opacity: 0.8; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .danger-btn { background: var(--danger-red); color: white; }
        .safe-btn { background: var(--safe-green); color: white; }
        .reset-btn { background: #7f8c8d; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="school-name">Hon Wah College (Primary Section)</div>
        <h2>Smart Home Shelter System Simulator</h2>
    </div>

    <div class="main-container">
        <div class="simulation-box">
            <h3>Situation 1: Without Smart System</h3>
            <div class="room-stage" id="stage1">
                <div class="wardrobe" id="ward1">
                    <div class="wardrobe-doors"><div class="door"></div><div class="door"></div></div>
                </div>
                <div class="bed-container" id="bed1">
                    <div class="mattress">
                        <div class="character" id="human1"><div class="head"></div><div class="body"></div></div>
                    </div>
                    <div class="bed-frame"></div>
                </div>
                <div class="floor"></div>
            </div>
            <div class="controls">
                <button class="btn danger-btn" onclick="startSituation1()">Simulate Earthquake</button>
            </div>
        </div>

        <div class="simulation-box">
            <h3>Situation 2: With Smart System</h3>
            <div class="room-stage" id="stage2">
                <div class="wardrobe" id="ward2">
                    <div class="wardrobe-doors"><div class="door"></div><div class="door"></div></div>
                    <div class="rotational-leg left-leg" id="leg2-left"></div>
                    <div class="rotational-leg right-leg" id="leg2-right"></div>
                </div>
                
                <div class="bed-container" id="bed2">
                    <div class="arched-shield" id="shield2"></div>
                    <div class="mattress">
                        <div class="character" id="human2"><div class="head"></div><div class="body"></div></div>
                    </div>
                    <div class="bed-frame"></div>
                </div>
                
                <div class="safety-zone" id="zone2">SAFE ZONE</div>
                <div class="floor"></div>
            </div>
            <div class="controls">
                <button class="btn safe-btn" onclick="startSituation2()">Activate Smart System</button>
            </div>
        </div>
    </div>

    <button class="btn reset-btn" onclick="resetAll()">Reset Simulation</button>

    <script>
        function startSituation1() {
            document.getElementById('stage1').classList.add('seismic-activity');
            setTimeout(() => {
                document.getElementById('ward1').classList.add('fall-danger');
                document.getElementById('human1').classList.add('person-crushed');
            }, 800);
        }

        function startSituation2() {
            document.getElementById('stage2').classList.add('seismic-activity');
            setTimeout(() => {
                document.getElementById('shield2').classList.add('shield-active'); 
                document.getElementById('leg2-left').classList.add('deployed');   
                document.getElementById('leg2-right').classList.add('deployed');  
                document.getElementById('bed2').classList.add('tilt-20');         
                setTimeout(() => {
                    document.getElementById('human2').classList.add('person-slide'); 
                    document.getElementById('zone2').style.opacity = "1";
                }, 600);
            }, 300);
        }

        function resetAll() {
            document.getElementById('stage1').classList.remove('seismic-activity');
            document.getElementById('ward1').classList.remove('fall-danger');
            document.getElementById('human1').className = 'character';
            document.getElementById('stage2').classList.remove('seismic-activity');
            document.getElementById('shield2').classList.remove('shield-active');
            document.getElementById('leg2-left').classList.remove('deployed');
            document.getElementById('leg2-right').classList.remove('deployed');
            document.getElementById('bed2').classList.remove('tilt-20');
            document.getElementById('human2').className = 'character';
            document.getElementById('zone2').style.opacity = "0";
        }
    </script>
</body>
</html>
